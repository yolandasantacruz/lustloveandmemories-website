packages:
  - 'apps/*'
  - 'packages/*'
  - 'libs/*'

# ==============================================================================
# Security & Build Isolation Controls (pnpm v11+)
# ==============================================================================

# Explicitly whitelist only trusted packages allowed to run postinstall/preinstall scripts.
# By default, pnpm v10+ blocks all lifecycle scripts to prevent malicious code execution.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  # Add other compiled dependencies as needed (e.g., swc, canvas, sharp)

  # Block transitive dependencies from pulling in code from untrusted/unverified sources
  # (e.g., raw git URLs, direct tarball downloads). This prevents dependency hijacking.
blockExoticSubdeps: true

# Enforce package provenance and trust verification, preventing version downgrades
# to package versions with weaker trust metadata (e.g., lack of registry signature).
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'semver@6.3.1'
  - 'tinyclip@0.1.13'
# Enforce a 3-day (4320 minutes) delay for installing newly published package versions.
# This "timelock" mitigates supply-chain risks by giving the security community time
# to identify and withdraw compromised package updates.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@analogjs/content@2.8.1'
  - '@analogjs/platform@2.8.1'
  - '@analogjs/router@2.8.1'
  - '@analogjs/vite-plugin-angular@2.8.1'
  - '@analogjs/vite-plugin-nitro@2.8.1'
  - '@analogjs/vitest-angular@2.8.1'
  - '@angular-devkit/architect@0.2202.3'
  - '@angular-devkit/core@22.2.3'
  - '@angular-devkit/schematics@22.2.3'
  - '@angular/animations@22.2.3'
  - '@angular/build@22.2.3'
  - '@angular/cli@22.2.3'
  - '@angular/common@22.2.3'
  - '@angular/compiler-cli@22.2.3'
  - '@angular/compiler@22.2.3'
  - '@angular/core@22.2.3'
  - '@angular/forms@22.2.3'
  - '@angular/platform-browser@22.2.3'
  - '@angular/platform-server@22.2.3'
  - '@angular/router@22.2.3'
  - '@schematics/angular@22.2.3'
